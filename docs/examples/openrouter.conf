# OpenRouter (openrouter.ai), from a gork built --with-openssl.
# Without OpenSSL, run `gork-relay openrouter.ai` somewhere and add
#   relay = HOST:8443
# Copy to ~/.gork.conf and chmod 600 it.

# OpenRouter wants its key as a Bearer token, which gork sends only in
# the OpenAI format.
protocol = openai
host     = openrouter.ai
path     = /api/v1/chat/completions
api_key  = sk-or-REPLACE-ME

# Any id from https://openrouter.ai/models, for instance:
model    = anthropic/claude-sonnet-5.5
