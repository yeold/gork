# A Unix gork built --with-serial, with no network: a null-modem cable to
# a machine that runs  gork-relay -t 0 -S /dev/ttyS0:38400 api.anthropic.com
# See docs/SERIAL.md. Copy to ~/.gork.conf and chmod 600 it.

# serial:DEVICE[:BAUD[:rtscts]], the same speed at both ends.
relay   = serial:/dev/ttyS0:38400
api_key = sk-ant-REPLACE-ME

# A reply comes whole, and slowly at low speeds: allow for it.
timeout = 300
