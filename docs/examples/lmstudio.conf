# A model in LM Studio 0.4.1 or later, on this machine. LM Studio speaks
# the Anthropic format itself, so no relay and no protocol line.
# Copy to ~/.gork.conf.

relay = localhost:1234
host  = localhost:1234
# A model LM Studio has loaded: curl localhost:1234/v1/models
model = ibm/granite-4-micro

# Only if "Require Authentication" is on in LM Studio:
# api_key = REPLACE-ME

# The context length the model was loaded with:
# context_window = 32768
