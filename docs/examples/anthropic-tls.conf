# Claude on Anthropic's API, from a gork built --with-openssl: gork does
# the TLS itself, so there is no relay line.
# Copy to ~/.gork.conf and chmod 600 it.

host    = api.anthropic.com
api_key = sk-ant-REPLACE-ME
model   = claude-opus-5

# If gork cannot find the system's certificates, point SSL_CERT_FILE at
# them in the environment, e.g. /etc/ssl/certs/ca-certificates.crt.
