# llama.cpp's server, on this machine. Start it with --jinja, or tool
# calls do not work:  llama-server -m model.gguf --jinja -c 32768
# Copy to ~/.gork.conf.

relay    = localhost:8080
host     = localhost:8080
protocol = openai
# llama-server serves the one model it loaded, whatever this says.
model    = local

# The same as -c above:
context_window = 32768
