# Mistral (api.mistral.ai), from a gork built --with-openssl.
# Without OpenSSL, run `gork-relay api.mistral.ai` somewhere and add
#   relay = HOST:8443
# Copy to ~/.gork.conf and chmod 600 it.

protocol = openai
host     = api.mistral.ai
# The key bare, with no quotes around it.
api_key  = REPLACE-ME
model    = mistral-large-latest

# If Mistral refuses requests with HTTP 422, turn streaming off:
# stream = no
