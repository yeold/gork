# A server with a self-signed certificate, from a gork built
# --with-openssl: a vLLM or other OpenAI-format server behind HTTPS on
# the LAN, say.
# Copy to ~/.gork.conf and chmod 600 it.

# tls:HOST:PORT for a port other than 443.
relay    = tls:llm.example.lan:8443
host     = llm.example.lan:8443
protocol = openai
model    = REPLACE-ME

# Trust the server's certificate (PEM), beside the system's:
ca_file  = /home/me/llm-server.pem

# Or, on a network you trust, check no certificate at all:
# tls_verify = no
