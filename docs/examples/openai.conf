# OpenAI's chat completions API, from a gork built --with-openssl.
# Without OpenSSL, run `gork-relay api.openai.com` somewhere and add
#   relay = HOST:8443
# (host stays api.openai.com: the relay passes it on).
# Copy to ~/.gork.conf and chmod 600 it.

protocol = openai
host     = api.openai.com
api_key  = sk-REPLACE-ME
# A model id from OpenAI's model list:
model    = REPLACE-ME
