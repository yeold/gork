# Sample gork config for Unix, macOS and the Cygwin package (win32).
# Copy it to ~/.gork.conf (Cygwin: %USERPROFILE%\.gork.conf) and, if it
# holds an api_key, chmod 600 it.
#
# One `key = value` per line. A comment must be a line of its own: text
# after a value, `#` included, is part of the value.

# Where gork connects: a gork-relay or stunnel that forwards to the API.
relay = relay.example.lan:8443

# Your Anthropic key, unless the relay adds it. ANTHROPIC_API_KEY beats it.
api_key = sk-ant-REPLACE-ME

# model = claude-opus-5
# default_effort = high

# Extra directories the file tools may use, `:`-separated (up to 8).
# On Cygwin, write them as Cygwin paths: /cygdrive/c/repos
# allow = /home/me/notes:/srv/shared

# timeout = 120
# retries = 2
# max_turns = 24
# stream = auto
# context_window = 200000
# auto_compact = 80

# A local model that speaks chat completions (Ollama, llama.cpp, LM Studio):
# relay = localhost:11434
# host = localhost:11434
# protocol = openai
# model = qwen3
