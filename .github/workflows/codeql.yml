# Vulnerability scan: CodeQL reads gork's C, the vendored cJSON included (as
# built for Linux, so not the code under #ifdef __MSDOS__ or _WIN32), and
# the workflows themselves, on
# every push to main and once a week for new queries.  Findings are under
# the repository's Security tab, "Code scanning".
name: codeql

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  schedule:
    - cron: '27 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write      # to upload the results
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - if: matrix.build-mode == 'manual'
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y autoconf automake libncurses-dev
          autoreconf -i && ./configure && make
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: sarif-out
      # The Security tab needs a login.  The list also goes out as an
      # annotation, which the public API shows: rule, place, message.
      - name: findings
        if: always()
        run: |
          jq -r '.runs[].results[]
                 | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text | gsub("\n"; " ") | .[0:140])"' \
              sarif-out/*.sarif | sort > findings.txt || true
          n=$(wc -l < findings.txt)
          cat findings.txt
          printf '::notice title=CodeQL: %s findings::%s\n' "$n" \
              "$(head -c 60000 findings.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
