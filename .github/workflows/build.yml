# Build gork and run testing/looptest.py on the two systems that nothing
# local can run: macOS and Cygwin; and run the Windows gork.exe, which
# Jenkins only tries under Wine, on a real Windows.  Everything else is built by Jenkins
# (Jenkinsfile) or by hand in QEMU (docs/PROGRESS.md).
name: build

on:
  push:
    branches: [main, 'ci/**']     # ci/*: to try something without touching main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash               # named, so that it runs with pipefail
    steps:
      - uses: actions/checkout@v5
      # curses comes with the system; only the autotools are missing.
      - run: brew install autoconf automake
      - run: autoreconf -i && ./configure && make
      - run: ./gork --version
      - run: python3 testing/looptest.py ./gork 2>&1 | tee test.log
      # The log needs a login to read; an annotation does not.
      - if: failure()
        run: |
          test -f test.log || exit 0
          printf '::error title=looptest::%s\n' "$(tail -c 3000 test.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"

  cygwin:
    runs-on: windows-latest
    defaults:
      run:
        # A login shell, so /usr/bin is first in PATH; CHERE_INVOKING keeps
        # it in the checkout instead of changing to the home directory.
        shell: C:\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
    env:
      CHERE_INVOKING: 1
    steps:
      # Git for Windows would check the files out with CRLF line ends,
      # which autoreconf and the shell do not take.
      - run: git config --global core.autocrlf input
        shell: bash
      - uses: actions/checkout@v5
      - uses: cygwin/cygwin-install-action@v6
        with:
          install-dir: C:\cygwin    # where the shell above looks for bash
          packages: gcc-core make autoconf automake libncurses-devel python3
      - run: autoreconf -i && ./configure && make
      - run: ./gork --version
      - run: python3 testing/looptest.py ./gork 2>&1 | tee test.log
      # The log needs a login to read; an annotation does not.
      - if: failure()
        run: |
          test -f test.log || exit 0
          printf '::error title=looptest::%s\n' "$(tail -c 3000 test.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"

  # The native gork.exe (MinGW, see winbuild.sh): cross-built on Linux as
  # Jenkins does it, then run on Windows.
  windows-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y gcc-mingw-w64-i686 zip
      - run: sh winbuild.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: gork-win32
          path: gork.exe

  windows:
    needs: windows-build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: gork-win32
      - run: ./gork.exe --version
      - run: python testing/wintest.py gork.exe 2>&1 | tee test.log
      - if: failure()
        run: |
          test -f test.log || exit 0
          printf '::error title=wintest::%s\n' "$(tail -c 3000 test.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
