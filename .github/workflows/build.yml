# Build gork and run testing/looptest.py on the two systems that nothing
# local can run: macOS and Cygwin; and run the Windows gork.exe, which
# Jenkins only tries under Wine, on a real Windows.  On a tag it also adds
# the macOS packages and the Cygwin package (gork-<version>-win32.zip) to
# the release that Jenkins makes.  Everything else is built by Jenkins
# (Jenkinsfile) or by hand in QEMU (docs/PROGRESS.md).
name: build

on:
  push:
    branches: [main, 'ci/**']     # ci/*: to try something without touching main
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write             # the release step uploads assets
    defaults:
      run:
        shell: bash               # named, so that it runs with pipefail
    steps:
      - uses: actions/checkout@v5
      # curses comes with the system; only the autotools are missing.
      - run: brew install autoconf automake
      - run: autoreconf -i && ./configure && make
      - run: ./gork --version
      - run: python3 testing/looptest.py ./gork 2>&1 | tee test.log
      # The log needs a login to read; an annotation does not.
      - if: failure()
        run: |
          test -f test.log || exit 0
          printf '::error title=looptest::%s\n' "$(tail -c 3000 test.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
      # The packages: one binary for Apple silicon and Intel, as an
      # installer (/usr/local/bin/gork) and as a tarball.  Not signed.
      - name: package
        run: |
          ver=$(sed -n 's/^AC_INIT(\[gork\], \[\(.*\)\])/\1/p' configure.ac)
          make distclean
          ./configure --disable-dependency-tracking \
              CFLAGS="-O2 -arch arm64 -arch x86_64 -mmacosx-version-min=11.0"
          make
          test "$(lipo -archs gork)" = "x86_64 arm64"
          python3 testing/looptest.py ./gork
          mkdir -p out root/usr/local/bin "gork-$ver-macos"
          cp gork root/usr/local/bin/
          pkgbuild --root root --install-location / --ownership recommended \
              --identifier org.yeold.gork --version "${ver%%~*}" \
              "out/gork-$ver-macos.pkg"
          cp gork README.md docs/BUILD.md "gork-$ver-macos/"
          tar czf "out/gork-$ver-macos.tar.gz" "gork-$ver-macos"
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: gork-macos
          path: out/
      # Jenkins makes the release from the same tag, with the other
      # packages; wait for it rather than race it.
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for i in $(seq 1 120); do
              gh release view "$TAG" >/dev/null 2>&1 && break
              sleep 30
          done
          gh release upload "$TAG" out/* --clobber

  cygwin:
    runs-on: windows-latest
    permissions:
      contents: write             # the release step uploads the package
    defaults:
      run:
        # A login shell, so /usr/bin is first in PATH; CHERE_INVOKING keeps
        # it in the checkout instead of changing to the home directory.
        shell: C:\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
    env:
      CHERE_INVOKING: 1
    steps:
      # Git for Windows would check the files out with CRLF line ends,
      # which autoreconf and the shell do not take.
      - run: git config --global core.autocrlf input
        shell: bash
      - uses: actions/checkout@v5
      - uses: cygwin/cygwin-install-action@v6
        with:
          install-dir: C:\cygwin    # where the shell above looks for bash
          packages: gcc-core make autoconf automake libncurses-devel python3 dash zip
      - run: autoreconf -i && ./configure && make
      - run: ./gork --version
      - run: python3 testing/looptest.py ./gork 2>&1 | tee test.log
      # The log needs a login to read; an annotation does not.
      - if: failure()
        run: |
          test -f test.log || exit 0
          printf '::error title=looptest::%s\n' "$(tail -c 3000 test.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
      # The Windows package for current systems: gork.exe with the Cygwin
      # DLLs, a shell and the terminal descriptions (cygpack.sh).
      - name: package
        run: |
          sh cygpack.sh out
          mkdir unpacked && cd unpacked && unzip -q ../out/gork-*-win32.zip
          find . | sort
      # ... tried the way a user has it: unpacked, started from cmd by the
      # Windows Python, with nothing of Cygwin on the PATH.
      - name: package test
        shell: cmd
        run: |
          for /d %%d in (unpacked\gork-*-win32) do python testing\cygpacktest.py %%d > pack.log 2>&1
          set rc=%errorlevel%
          type pack.log
          exit /b %rc%
      - if: failure()
        run: |
          test -f pack.log || exit 0
          printf '::error title=cygpacktest::%s\n' "$(tail -c 3000 pack.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
      - uses: actions/upload-artifact@v4
        with:
          name: gork-cygwin
          path: out/
      # As for macOS: Jenkins makes the release; wait for it.
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for i in $(seq 1 120); do
              gh release view "$TAG" >/dev/null 2>&1 && break
              sleep 30
          done
          gh release upload "$TAG" out/* --clobber

  # The native gork.exe (MinGW, see winbuild.sh): cross-built on Linux as
  # Jenkins does it, then run on Windows.
  windows-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y gcc-mingw-w64-i686 zip
      - run: sh winbuild.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: gork-win32
          path: gork.exe

  windows:
    needs: windows-build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: gork-win32
      - run: ./gork.exe --version
      - run: python testing/wintest.py gork.exe 2>&1 | tee test.log
      - if: failure()
        run: |
          test -f test.log || exit 0
          printf '::error title=wintest::%s\n' "$(tail -c 3000 test.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
